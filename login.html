<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLOGON ACADEMY | Candidate Login</title>
<link rel="icon" type="image/png" href="Logoicon.png?v=2026.2">
    <link rel="stylesheet" href="style.css?v=20261120-v9">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Poppins',Arial, sans-serif;
            background: #F8FAF7;
            color: #26332D;
            /* Background Image Setup */
            background-image: url('loginbg.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #f4f5f0; /* Fallback color */
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 38px 32px;
            background: #FFFFFF;
            border: 1px solid #E4EAE5;
            border-radius: 16px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.07);
        }

        .brand {
            text-align: center;
            margin-bottom: 24px;
        }

        .login-brand-logo {
            max-width: 220px;
            width: 100%;
            height: auto;
            display: block;
            margin: 0 auto 12px;
            object-fit: contain;
        }

        .brand h1 {
            margin: 0;
            color: #6B1D2F;
            font-size: 24px;
            letter-spacing: 0.8px;
            font-weight: 700;
        }

        .brand p {
            margin-top: 6px;
            color: #6E6264;
            font-size: 13px;
        }

        h2 {
            margin-bottom: 8px;
            font-size: 22px;
            color: #251417;
        }

        .subtitle {
            color: #6E6264;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 17px 0 8px;
            font-weight: 600;
            font-size: 14px;
            color: #251417;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #D8D2C5;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            background: #FFFFFF;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: #6B1D2F;
            box-shadow: 0 0 0 3px rgba(107, 29, 47, 0.12);
        }

        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper input {
            width: 100%;
            padding-right: 44px;
        }

        .toggle-password-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent !important;
            border: none !important;
            padding: 6px !important;
            margin: 0 !important;
            width: auto !important;
            height: auto !important;
            min-width: 0 !important;
            color: #738078 !important;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            transition: color 0.2s ease, background 0.2s ease;
            z-index: 2;
        }

        .toggle-password-btn:hover {
            color: #6B1D2F !important;
            background: rgba(107, 29, 47, 0.08) !important;
        }

        .toggle-password-btn:focus-visible {
            outline: 2px solid #6B1D2F;
            outline-offset: 1px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background: linear-gradient(135deg, #7A1E24 0%, #561524 100%);
            color: #FFFFFF;
            border: 1px solid #6B1D2F;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(107, 29, 47, 0.28);
            transition: all 0.2s ease;
        }

        button:hover {
            background: linear-gradient(135deg, #8B242B 0%, #631829 100%);
            box-shadow: 0 6px 18px rgba(107, 29, 47, 0.38);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
        }

        .footer {
            text-align: center;
            margin-top: 28px;
            color: #89938C;
            font-size: 12px;
        }
        
/* TABLET */
@media (max-width: 900px) {
    body {
        background-size: cover;
        background-position: center center;
    }

    .login-card {
        max-width: 400px;
    }
}

/* MOBILE */
@media (max-width: 600px) {
    body {
        padding: 20px 15px;
        background-size: cover;
        background-position: center center;
        background-color: #eaf2fa;
    }

    .login-card {
        max-width: 420px;
        padding: 32px 24px;
    }

    .brand h1 {
        font-size: 23px;
    }
}

    </style>
</head>
<body>

    <main class="login-card">

        <header class="brand">
            <img src="slogon-logo-full.png?v=2026.2" alt="SLOGON ACADEMY" class="login-brand-logo">
        </header>

        <h2>Candidate Login</h2>
        <p class="subtitle">
            Sign in to access your mock examinations.
        </p>

        <form id="loginForm">

            <label for="userId">Candidate User ID</label>
            <input
                type="text"
                id="userId"
                name="userId"
                placeholder="Enter your User ID"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>
            <div class="password-wrapper">
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
                <button type="button" id="togglePassword" class="toggle-password-btn" aria-label="Show password" title="Show password">
                    <svg id="eyeOpenIcon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                    <svg id="eyeClosedIcon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                        <line x1="1" y1="23" x2="23" y2="1"></line>
                    </svg>
                </button>
            </div>

            <button type="submit" id="loginButton">
                LOGIN
            </button>

            <p id="message" role="status" aria-live="polite"></p>

        </form>

        <footer class="footer">
            © SLOGON ACADEMY | Mock Test Portal
        </footer>

    </main>

    <script src="login.js"></script>

</body>
</html>
