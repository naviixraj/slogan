<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="SLOGON Academy Professional Online Examination Platform">

    <title>SLOGON Academy | Student Login</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Main CSS -->
    <link rel="stylesheet" href="style.css">

</head>


<body>

    <a href="tests.html" class="nav-back-floating" title="Back to Tests" aria-label="Back to Tests">
        <svg viewBox="0 0 24 24" width="26" height="26" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
    </a>

    <!-- MAIN CONTAINER -->
    <main class="login-page">

        <!-- LOGIN CARD -->
        <section class="login-card">

            <!-- BRAND HEADER -->
            <div class="brand-header">

                <div class="academy-logo">
                    <span>S</span>
                </div>

                <h1>SLOGON ACADEMY</h1>

            </div>


            <!-- GOLD ACCENT LINE -->
            <div class="gold-line"></div>


            <!-- LOGIN CONTENT -->
            <div class="login-content">

                <div class="login-title">

                    <h2>STUDENT LOGIN</h2>

                    <p>Please enter your details to begin the examination</p>

                </div>


                <!-- LOGIN FORM -->
                <form id="loginForm">

                    <!-- CANDIDATE NAME -->
                    <div class="form-group">

                        <label for="candidateName">
                            Candidate Name
                        </label>

                        <input
                            type="text"
                            id="candidateName"
                            name="candidateName"
                            placeholder="Enter your full name"
                            autocomplete="name">

                        <small class="error-message" id="nameError"></small>

                    </div>


                    <!-- REGISTER NUMBER -->
                    <div class="form-group">

                        <label for="registerNumber">
                            Register Number
                        </label>

                        <input
                            type="text"
                            id="registerNumber"
                            name="registerNumber"
                            placeholder="Enter register number">

                        <small class="error-message" id="registerError"></small>

                    </div>


                    <!-- SUBJECT -->
                    <div class="form-group">

                        <label for="subject">
                            Subject
                        </label>

                        <select id="subject" name="subject">

                            <option value="Tamil" selected>
                                Tamil
                            </option>

                            <option value="English">
                                English
                            </option>

                            <option value="Paper 1">
                                Paper 1
                            </option>

                        </select>

                    </div>


                    <!-- EXAM NAME -->
                    <div class="form-group">

                        <label for="examName">
                            Exam Name
                        </label>

                        <select id="examName" name="examName">

                            <option value="UGC NET Mock Test" selected>
                                UGC NET Mock Test
                            </option>

                            <option value="TN SET Mock Test">
                                TN SET Mock Test
                            </option>

                            <option value="TRB Mock Test">
                                TRB Mock Test
                            </option>

                            <option value="Practice Test">
                                Practice Test
                            </option>

                        </select>

                    </div>


                    <!-- START BUTTON -->
                    <button type="submit" class="start-btn">

                        <span>START TEST</span>

                        <span class="arrow">→</span>

                    </button>


                </form>

            </div>


            <!-- CARD FOOTER -->
            <div class="login-footer">

                <p>
                    Professional Competitive Examination Platform
                </p>

            </div>

        </section>

    </main>


    <!-- LOGIN JAVASCRIPT -->
    <script>

        const loginForm = document.getElementById("loginForm");

        const candidateName = document.getElementById("candidateName");

        const registerNumber = document.getElementById("registerNumber");

        const subject = document.getElementById("subject");

        const examName = document.getElementById("examName");

        const nameError = document.getElementById("nameError");

        const registerError = document.getElementById("registerError");


        loginForm.addEventListener("submit", function (event) {

            event.preventDefault();


            // Clear previous error messages
            nameError.textContent = "";
            registerError.textContent = "";

            candidateName.classList.remove("input-error");
            registerNumber.classList.remove("input-error");


            let isValid = true;


            // Validate Candidate Name
            if (candidateName.value.trim() === "") {

                nameError.textContent = "Please enter Candidate Name";

                candidateName.classList.add("input-error");

                isValid = false;

            }


            // Validate Register Number
            if (registerNumber.value.trim() === "") {

                registerError.textContent = "Please enter Register Number";

                registerNumber.classList.add("input-error");

                isValid = false;

            }


            // If form is valid
            if (isValid) {

                const candidateInfo = {

                    name: candidateName.value.trim(),

                    registerNumber: registerNumber.value.trim(),

                    subject: subject.value,

                    exam: examName.value

                };


                // Save student information
                localStorage.setItem(
                    "candidateInfo",
                    JSON.stringify(candidateInfo)
                );


                // Redirect to instruction page
                window.location.href = "instructions.html";

            }

        });


        // Remove error while typing
        candidateName.addEventListener("input", function () {

            nameError.textContent = "";

            candidateName.classList.remove("input-error");

        });


        registerNumber.addEventListener("input", function () {

            registerError.textContent = "";

            registerNumber.classList.remove("input-error");

        });

    </script>


</body>
</html>
